<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 정보 수정 — playlog</title>
<meta name="theme-color" content="#F3DE8E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="playlog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=IBM+Plex+Sans+KR:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div class="app sans form-page">

  <header class="topbar detail">
    <a href="index.html" class="round-btn" id="back" aria-label="뒤로">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
  </header>

  <div class="page-head">
    <div class="page-head-text">
      <h1 class="page-title">MY INFO</h1>
      <span class="page-sub">다른 사람에게 보이는 이름과 사진이에요</span>
    </div>
  </div>

  <main>
    <form class="form-card" id="profile-form" novalidate>
      <div class="profile-photo">
        <div class="photo-wrap">
          <span class="ava-lg initial" id="photo" aria-hidden="true">?</span>
          <label class="photo-edit" title="사진 바꾸기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
            <input type="file" id="photo-input" accept="image/*" aria-label="프로필 사진 바꾸기">
          </label>
        </div>
        <div class="photo-actions">
          <button type="button" class="pill" id="photo-reset" hidden>카카오 사진으로 되돌리기</button>
        </div>
      </div>

      <div class="field">
        <label for="nickname">닉네임</label>
        <input class="input" id="nickname" name="nickname" maxlength="20" autocomplete="nickname" required>
        <span class="count" id="nick-count" aria-live="polite">0 / 20</span>
      </div>

      <div class="field">
        <span class="label">이메일</span>
        <div class="readonly"><span id="email">—</span><small>카카오 계정</small></div>
        <span class="hint">이메일은 카카오 계정에서 가져와요. 바꾸려면 카카오에서 바꿔 주세요.</span>
      </div>

      <p class="notice error" id="msg-error" role="alert" hidden></p>
      <p class="notice ok" id="msg-ok" role="status" hidden></p>

      <button type="submit" class="btn-primary" id="save">저장</button>
    </form>
  </main>

</div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/profile.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
